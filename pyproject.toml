[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-sorting"
version = "0.1.0"
description = "Foundations for SO-101 imitation learning in Isaac Lab."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "SO-101 Isaac Lab contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyyaml>=6.0",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
  "integration: requires an installed LeRobot/Isaac/CUDA stack or remote dataset access",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["datasets", "outputs", "checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Long prose and generated SVG fragments remain readable as single strings.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
